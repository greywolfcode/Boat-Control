<!DOCTYPE html>

<html>
    <head>
        <title>Boat Control</title>
    </head>
    <body>
        <canvas id="c"></canvas>
        <style>
            html, body { 
                margin: 0;
                padding: 0;
                background: black; 
            }
            canvas {
                background: blue; 
                object-fit: contain;
            }
        </style>
        <script>
            const c = document.getElementById("c");
            const w = c.width = 800;
            const h = c.height = 480;
            const cntX = w/2;
            const cntY = h/2;
            const ctx = c.getContext("2d");
            let bts = [];
            const dks = [];
            const lnd = [
                [[0, 0], [0, 200], [311, 152], [300, 130], [292, 119], [350, 90], [367, 123], [400, 0]],
                [[400, 480], [530, 397], [550, 432], [606, 399], [606, 399], [582, 368], [800, 300], [800, 480]]
            ];
            let m = false;
            let mBt = null;
            let dt = 0;
            let lt = performance.now();
            let scr = 0;
            let spwnT = 1;
            let spwnI = 0;

            function getA(x1, y1, x2, y2)
            {
                let a = Math.atan2(x1 - x2, y1 - y2)
                if (a < 0)
                {
                    a += 2 * Math.PI;
                }
                return a;
            }
            
            function crtDk(x, y, col, a)
            {
                return {
                    x,
                    y,
                    col,
                    a,
                    d: false,
                    w:30,
                    t:0,
                    bt:null,
                    i: crypto.randomUUID()
                };
            }

            function crtBt()
            {
                let wl = Math.random();
                let wr = Math.random();
                let hr = Math.random();
                let s =  Math.random()*10;
                let col = Math.round(Math.random());
                let c;
                let spd;
                let ht;                
                if (s < 0.33)
                {
                    spd=0.06;
                    c=1;
                    ht=5;
                }
                else if (s < 0.66)
                {
                    spd=0.05;
                    c=2;
                    ht=10;
                }
                else
                {
                    spd=0.04;
                    c=3;
                    ht=15;
                }
                let x=0;
                let y=0;
                if (wl < 0.5)
                {
                    x=0;
                    y = 200 + hr * 280;
                }
                else
                {
                    x=795;
                    y = hr * 180;
                }
                let a = getA(x, y, cntX, cntY);
                
                return {
                    s,
                    col,
                    c,
                    pt: [],
                    spd,
                    x: x+5, 
                    y:y-(ht+c)/2,
                    pX: x+5, 
                    pY: y-(ht+c)/2,
                    h:ht+c,
                    w:10,
                    a,
                    d: false
                };
            }
            function spwnCrv(x)
            {
                return ((1 - Math.E ** (-0.5 * x)) / (1 - Math.E ** (-0.5))) ** 0.15
            }
            function spwn()
            {
                if (spwnT > spwnI)
                {
                    let bt = crtBt();
                    bt.i = bts.length;
                    bts.push(bt);
                    spwnT = 0;
                    spwnI = spwnCrv(Math.random()) * 5000;
                }
                else
                {
                    spwnT += dt;
                }

            }

            function col(bt1, bt2)
            {
                let dx = bt1.x - bt2.x;
                let dy = bt1.y - bt2.y;
                let d = (bt1.w) + (bt2.w);

                return (dx **2 + dy **2) <= (d ** 2);
            }

            function ccw(pt1, pt2, pt3)
            {
                return (pt3[1] - pt1[1]) * (pt2[0] - pt1[0]) > (pt2[1] - pt1[1]) * (pt3[0]- pt1[0]);
            }

            function lnCol(pt1, pt2, bt)
            {
                return ccw(pt1, [bt.x, bt.y], [bt.pX, bt.pY]) != ccw(pt2,  [bt.x, bt.y], [bt.pX, bt.pY]) && ccw(pt1, pt2,  [bt.x, bt.y]) != ccw(pt1, pt2, [bt.pX, bt.pY]);
            }

            function dot (x1, y1, x2, y2)
            {
                return x1 * x2 + y1 * y2;
            }

            function ref(pt1, pt2, a)
            {
                let bv = [Math.cos(a), Math.sin(a)];

                let v = [pt2[0] - pt1[0], pt2[1] - pt1[1]];
                let l = Math.hypot(v[0], v[1]);
                v = v.map(n => n / l);
                let d = dot(bv[0], bv[1], v[0], v[1])

                let rX = 2 * d * v[0] - bv[0];
                let rY = 2 * d * v[1] - bv[1];

                return Math.atan2(rY, rX) + Math.PI;
            }

            function drwBt(bt)
            {
                ctx.fillStyle = "lightgrey";
                ctx.save();
                ctx.translate(bt.x, bt.y);
                ctx.rotate(Math.PI-bt.a);
                ctx.beginPath();
                ctx.fillRect(-bt.w/2, -bt.h/2, bt.w, bt.h, bt.a);
                ctx.arc(0, bt.h/2, bt.w/2, 0, Math.PI);
                ctx.fill();

                if (bt.col < 0.5)
                {
                    ctx.fillStyle = "purple";
                }
                else
                {
                    ctx.fillStyle = "orange";
                }
                
                for(let i=0; i<bt.c; i++)
                {
                     ctx.fillRect(-bt.w/2+1, -bt.h/2+ 5*i+i, bt.w-2, 5, bt.a);
                }
                ctx.restore()
                ctx.strokeStyle = "lightgrey";
                let prv = [bt.x, bt.y];
                bt.pt.forEach(pt => {
                    ctx.beginPath();
                    ctx.moveTo(prv[0], prv[1]);
                    ctx.lineTo(pt[0], pt[1]);
                    ctx.stroke();
                    prv = pt;
                });
            }
            function mvBt(bt)
            {
                if(bt.pt.length  > 0)
                {
                    let p = bt.pt[0];
                    bt.a = getA(bt.x, bt.y, p[0], p[1]);
                    let d = Math.sqrt((bt.x - p[0]) ** 2 + (bt.y - p[1]) ** 2);
                    if ( d <= 1)
                    {
                        bt.pt.shift();
                    }
                }
                bt.pX = bt.x;
                bt.pY = bt.y
                bt.x -= bt.spd*Math.sin(bt.a)*dt;
                bt.y -= bt.spd*Math.cos(bt.a)*dt;
            }
            function drwDk(dk)
            {
                ctx.save();
                ctx.translate(dk.x, dk.y);
                ctx.rotate(dk.a);

                let l = -5;
                let t = -20;

                if (dk.col < 1)
                {
                    ctx.fillStyle = "purple";
                }
                else
                {
                    ctx.fillStyle = "orange";
                }

                ctx.beginPath();
                ctx.fillRect(l-10, t-10, 30, 5);
                ctx.fillRect(l-10, t-10, 5, 40);
                ctx.fillRect(l+18, t-10, 5, 40);

                ctx.restore()
            }
            function drwLnd(lnd)
            {
                ctx.fillStyle = "green";
                ctx.beginPath();
                ctx.moveTo(lnd[0][0], lnd[0][1]);
                for (let i=1; i<lnd.length; i++)
                {
                    ctx.lineTo(lnd[i][0], lnd[i][1]);

                }
                ctx.closePath();
                ctx.fill();
            }

            dks.push(crtDk(348, 121, 0, -Math.PI/6));
            dks.push(crtDk(320, 137, 0, -Math.PI/6));
            dks.push(crtDk(578, 381, 1, 5*Math.PI/6));
            dks.push(crtDk(550, 397, 1, 5*Math.PI/6));


            bts.push(crtBt());
            function main()
            {
                dt = performance.now() - lt;
                lt = performance.now();    
                
                spwn();

                ctx.clearRect(0, 0, c.width, c.height);

                
                lnd.forEach(pt => {
                    drwLnd(pt);
                });
                dks.forEach(dk => {
                    drwDk(dk);
                    if (dk.d)
                    {
                        if (dk.t > 2500)
                        {
                            dk.t = 0
                            dk.bt.c--;
                            scr++;
                        }
                        else
                        {
                            dk.t += dt;
                        }

                        if (dk.bt.c < 1)
                        {
                            dk.d = false;
                            dk.bt.a += Math.PI
                        }
                    }
                });
                bts.forEach(bt => {
                    drwBt(bt);
                    if (!bt.d)
                    {
                        mvBt(bt);
                        dks.some(dk => {
                            if (!dk.d && dk.col == bt.col && bt.c > 0)
                            {
                                if (col(dk, bt))
                                {
                                    bt.d = true;
                                    dk.d = true;
                                    bt.x = dk.x;
                                    bt.y = dk.y;
                                    bt.a = -dk.a;
                                    bt.pt = [];
                                    dk.bt = bt;
                                    return true;
                                }
                            }
                        });
                    }
                    lnd.forEach(pt => {
                        let prev = pt[0];
                        for (let i=1; i<pt.length; i++)
                        {
                            if (lnCol(prev, pt[i], bt))
                            {
                                bt.a = ref(prev, pt[i], bt.a);
                                bt.pt = [];
                                mvBt(bt);
                            }
                        }
                    });
                    [[[0, 0], [0, 480]], [[0, 480], [800, 480]], [[800, 480], [800, 0]], [[800, 0], [0, 0]]].forEach(pt => {
                        let prev = pt[0];
                        for (let i=1; i<pt.length; i++)
                        {
                            if (lnCol(prev, pt[i], bt))
                            {
                                if (bt.c < 1)
                                {
                                    bts = bts.filter(b => b.i != bt.i);
                                }
                                else
                                {
                                    bt.a = ref(prev, pt[i], bt.a);
                                    bt.pt = [];
                                    mvBt(bt);
                                }
                            }
                        }
                    });
                });

                ctx.fillStyle = "white";
                ctx.fillText("Cargo: " + scr, 20, 20);

                requestAnimationFrame(main);
            }

            function getMP(e)
            {
                const rect = c.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            c.addEventListener("mousemove", (e) =>
            {
                let mP = getMP(e);
                if (mBt != null)
                {
                    mBt.pt.push([mP.x, mP.y]);
                }
            });
            c.addEventListener("mousedown", (e) =>
            {
                m=true;
                let mP = getMP(e);

                let x = mP.x; 
                let y = mP.y;
                let mr = {
                    x: x, 
                    y: y,
                    h:0,
                    w:0,
                }
                
                bts.forEach(bt => {
                    if ((!bt.d || bt.c < 1) && col(bt, mr))
                    {
                        mBt = bt;
                        bt.pt = [];

                        if (bt.c < 1)
                        {
                            bt.d = false;
                        }
                    }
                });
            });
            c.addEventListener("mouseup", (e) =>
            {
               m=false;
               mBt=null;
            });
            c.addEventListener("mouseleave", (e) =>
            {
               m=false;
               mBt=null;
            });

            main();
        </script>
    </body>
</html>
