<!DOCTYPE html>

<html>
    <head>
        <title>Boat Control</title>
    </head>
    <body>
        <canvas id="c"></canvas>
        <style>
            html, body { 
                margin: 0;
                padding: 0;
                background: black; 
            }
            canvas {
                background: blue; 
                object-fit: contain;
            }
        </style>
        <script>
            const c = document.getElementById("c");
            const w = c.width = 800;
            const h = c.height = 640;
            const cntX = w/2;
            const cntY = h/2;
            const ctx = c.getContext("2d");
            const bts = [];
            let m = false;
            let mBt = null;
            let dt = 0;
            let lt = performance.now();

            function crtBt()
            {
                let wl = Math.random();
                let wr = Math.random();
                let hr = Math.random();
                let s =  Math.random()*10;
                let col = Math.random();
                let c;
                let spd;
                if (s < 0.33)
                {
                    spd=0.06;
                    c=1;
                }
                else if (s < 0.66)
                {
                    spd=0.05;
                    c=2
                }
                else
                {
                    spd=0.04;
                    c=3;
                }
                let x=0;
                let y=0;
                if (wl < 0.5)
                {
                    x=0;
                    y = hr * w;
                }
                else
                {
                    x=w-s;
                    y = hr * w;
                }
                let a = Math.atan2(x - cntX, y - cntY)
                if (a < 0)
                {
                    a += 2 * Math.PI;
                }
                let ht;                
                if (s < 0.33)
                {  
                    ht=5;
                }
                else if (s < 0.99)
                {
                    ht=10;
                }
                else
                {
                    ht=15;
                }
                
                return {
                    s,
                    col,
                    c,
                    spd,
                    x: x+5, 
                    y:y-(ht+c)/2,
                    h:ht+c,
                    w:10,
                    a,
                };
            }

            function col(bt1, bt2)
            {
                let dx = bt1.x - bt2.x;
                let dy = bt1.y - bt2.y;
                let d = (bt1.w) + (bt2.w);

                return (dx **2 + dy **2) <= (d ** 2);
            }

            function drwBt(bt)
            {
                ctx.fillStyle = "lightgrey";
                ctx.save();
                ctx.translate(bt.x, bt.y);
                ctx.rotate(bt.a);
                ctx.beginPath();
                ctx.fillRect(-bt.w/2, -bt.h/2, bt.w, bt.h, bt.a);
                ctx.arc(0, bt.h/2, bt.w/2, 0, Math.PI);
                ctx.fill();

                if (bt.col < 0.5)
                {
                    ctx.fillStyle = "purple";
                }
                else
                {
                    ctx.fillStyle = "orange";
                }
                
                for(let i=0; i<bt.c; i++)
                {
                     ctx.fillRect(-bt.w/2+1, -bt.h/2+ 5*i+i, bt.w-2, 5, bt.a);
                }

                ctx.restore();
            }

            

            bts.push(crtBt());

            function main()
            {
                dt = performance.now() - lt;
                lt = performance.now();     

                bts.push(crtBt());
                ctx.clearRect(0, 0, c.width, c.height);

                bts.forEach(bt => {
                    bt.x -= bt.spd*Math.sin(bt.a)*dt;
                    bt.y -= bt.spd*Math.cos(bt.a)*dt;
                    drwBt(bt);
                });

                requestAnimationFrame(main);
            }

            c.addEventListener("mousemove", (e) =>
            {
                if (m)
                {
                    bts[0].x = e.clientX;
                    bts[0].y = e.clientY;
                }
            });
            c.addEventListener("mousedown", (e) =>
            {
                m=true;
            });
            c.addEventListener("mouseup", (e) =>
            {
               m=false;
            });

            main();
        </script>
    </body>
</html>
