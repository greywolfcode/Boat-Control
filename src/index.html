<!DOCTYPE html>

<html>
    <head>
        
    </head>
    <body>
        <canvas id="c"></canvas>
        <style>
            body { 
                background: black; 
                color: white; 
                font-family: sans-serif; 
            }
        </style>
        <script>

            const c = document.getElementById("c");
            const w = c.width;
            const h = c.height;
            const cntX = w/2;
            const cntY = h/2;
            const ctx = c.getContext("2d");
            const bts = [];
            let m = false;

            function crtBt()
            {
                let wl = Math.random();
                let wr = Math.random();
                let hr = Math.random();
                let s =  Math.random()*10;
                let spd;
                if (s < 0.33)
                {
                    spd=6
                }
                else if (s < 0.66)
                {
                    spd=5
                }
                else
                {
                    spd=4
                }
                let x=0;
                let y=0;
                if (wl < 0.5)
                {
                    x=0;
                    y = hr * w;
                }
                else
                {
                    x=w-s;
                    y = hr * w;
                }
                let a = Math.atan2(x - cntX, y - cntY)
                if (a < 0)
                {
                    a += 2 * Math.PI;
                }
                let ht;                
                if (s < 0.33)
                {  
                    ht=5;
                }
                else if (s < 0.99)
                {
                    ht=10;
                }
                else
                {
                    ht=15;
                }
                
                return {
                    s,
                    spd,
                    x, 
                    y,
                    h:ht,
                    w:5,
                    a
                };
            }

            function drwBt(bt)
            {
                ctx.save();
                ctx.translate(bt.x + bt.w, bt.y + bt.h);
                ctx.rotate(-bt.a);
                ctx.fillRect(-bt.w, -bt.h, bt.w, bt.h);
                ctx.restore();
            }

            i = setInterval(main, 60);

            bts.push(crtBt());
            ctx.fillStyle = "red";

            function main()
            {
                bts.push(crtBt());
                ctx.clearRect(0, 0, c.width, c.height);

                bts.forEach(bt => {
                    bt.x += bt.spd*Math.cos(bt.a);
                    bt.y += bt.spd*Math.sin(bt.a);
                    drwBt(bt);
                });
            }

            c.addEventListener("mousemove", (e) =>
            {
                if (m)
                {
                    bts[0].x = e.clientX;
                    bts[0].y = e.clientY;
                }
            });
            c.addEventListener("mousedown", (e) =>
            {
                m=true;
            });
            c.addEventListener("mouseup", (e) =>
            {
               m=false;
            });

        </script>
    </body>
</html>
