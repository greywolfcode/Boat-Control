<!DOCTYPE html>

<html>
    <head>
        <title>Boat Control</title>
    </head>
    <body>
        <canvas id="c"></canvas>
        <style>
            body { 
                background: black; 
                color: white; 
                font-family: sans-serif; 
            }
        </style>
        <script>
            const c = document.getElementById("c");
            const w = c.width;
            const h = c.height;
            const cntX = w/2;
            const cntY = h/2;
            const ctx = c.getContext("2d");
            const bts = [];
            let m = false;
            let dt = 0;
            let lt = performance.now();

            function crtBt()
            {
                let wl = Math.random();
                let wr = Math.random();
                let hr = Math.random();
                let s =  Math.random()*10;
                let col = Math.random();
                let c;
                let spd;
                if (s < 0.33)
                {
                    spd=6;
                    c=1;
                }
                else if (s < 0.66)
                {
                    spd=5;
                    c=2
                }
                else
                {
                    spd=4;
                    c=3;
                }
                let x=0;
                let y=0;
                if (wl < 0.5)
                {
                    x=0;
                    y = hr * w;
                }
                else
                {
                    x=w-s;
                    y = hr * w;
                }
                let a = Math.atan2(x - cntX, y - cntY)
                if (a < 0)
                {
                    a += 2 * Math.PI;
                }
                let ht;                
                if (s < 0.33)
                {  
                    ht=5;
                }
                else if (s < 0.99)
                {
                    ht=10;
                }
                else
                {
                    ht=15;
                }
                
                return {
                    s,
                    col,
                    c,
                    spd,
                    x, 
                    y,
                    h:ht+c,
                    w:10,
                    a,
                    tl: [x, y],
                    tr: [
                            x + w * Math.cos(a), 
                            y + w * Math.sin(a)
                        ],
                    bl: [
                            x - h * Math.sin(a), 
                            y + h * Math.cos(a)
                        ],
                    br: [
                            x + w * Math.cos(a) - h * Math.sin(a), 
                            y + w * Math.sin(a) + h * Math.cos(a)
                        ]
                };
            }

            function getAxs(bt)
            {
                let aX = bt.tl[0] - (bt.tl[0] + bt.w * Math.cos(bt.a));
                let aY = bt.tl[1] - (bt.tl[1] + bt.h * Math.sin(bt.a));

                return [
                    {
                        x: aX,
                        y: aY
                    },
                    {
                        x: aY,
                        y: -aX
                    },
                ];
            }
            function projp1(c, ax)
            {
                return (c[0] * ax.x + c[1] * ax.y) / (ax.x ** 2 + ax.y ** 2);
            }
            function dotProd(v1, v2)
            {
                return v1.x * v2.x + v1.y * v2.y;
            }
            function proj(bt, ax)
            {
                return [
                    {
                        x: projp1(bt.tl, ax) * ax.x, 
                        y: projp1(bt.tl, ax) * ax.y 
                    },
                    {
                        x: projp1(bt.tr, ax) * ax.x, 
                        y: projp1(bt.tr, ax) * ax.y 
                    },
                    {
                        x: projp1(bt.bl, ax) * ax.x, 
                        y: projp1(bt.bl, ax) * ax.y 
                    },
                    {
                        x: projp1(bt.br, ax) * ax.x, 
                        y: projp1(bt.br, ax) * ax.y 
                    }
                ];
            }

            function col(bt1, bt2)
            {
                let axs = [...getAxs(bt1), ...getAxs(bt2)];

                axs.forEach(ax => {
                    let proj1 = proj(bt1, ax); 
                    let proj2 = proj(bt2, ax); 
                    let sclr1 = [Math.min(proj1), Math.max(proj1)];
                    let sclr2 = [Math.min(proj2), Math.max(proj2)];
                    if (sclr1[0] <= sclr2[1] && sclr1[1] >= sclr2[0])
                    {
                        return true;    
                    }
                });

                return false;
            }

            function drwBt(bt)
            {
                ctx.fillStyle = "lightgrey";

                ctx.save();
                ctx.translate(bt.x + bt.w, bt.y + bt.h);
                ctx.rotate(-bt.a);
                ctx.beginPath();
                ctx.fillRect(-bt.w, -bt.h, bt.w, bt.h);
                ctx.arc(-bt.w/2, -bt.h, bt.w/2, 0, 180);
                ctx.fill();

                if (bt.col < 0.5)
                {
                    ctx.fillStyle = "purple";
                }
                else
                {
                    ctx.fillStyle = "orange";
                }
                
                for(let i=0; i<bt.c; i++)
                {
                     ctx.fillRect(-bt.w + 1, -bt.h+5*i+i, bt.w - 2, 5);
                }

                ctx.restore();
            }

            i = setInterval(main, 60);

            bts.push(crtBt());

            function main()
            {
                dt = lt - performance.now();
                lt = performance.now();     

                bts.push(crtBt());
                ctx.clearRect(0, 0, c.width, c.height);

                bts.forEach(bt => {
                    bt.x -= bt.spd*Math.sin(bt.a);
                    bt.y -= bt.spd*Math.cos(bt.a);
                    drwBt(bt);
                });
            }

            c.addEventListener("mousemove", (e) =>
            {
                if (m)
                {
                    bts[0].x = e.clientX;
                    bts[0].y = e.clientY;
                }
            });
            c.addEventListener("mousedown", (e) =>
            {
                m=true;
            });
            c.addEventListener("mouseup", (e) =>
            {
               m=false;
            });

        </script>
    </body>
</html>
